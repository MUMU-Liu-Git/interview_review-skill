<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>面试题库与思考/回答框架</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');
  :root{
    --bg:#FFF8E7; --card:#ffffff; --ink:#111111; --sub:#4a4a4a;
    --line:#111111; --brand:#2D5BFF; --brand-d:#111111;
    --star:#FFB800; --ok:#06C270; --warn:#FF9F1C;
    /* 难度语义（野兽派亮色）：高频=红 / 较可能=黄 / 深挖=青 */
    --s3:#FFD9D9; --s3b:#D62828; --s2:#FFEFA6; --s2b:#8A6A00; --s1:#B8F1EB; --s1b:#0B6E68;
    /* 硬阴影（无模糊）*/
    --shadow:4px 4px 0 #111; --shadow-sm:3px 3px 0 #111; --shadow-lg:7px 7px 0 #111;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.7;padding-top:64px;padding-left:248px;
    -webkit-font-smoothing:antialiased;transition:padding-left .25s}
  body.nav-collapsed{padding-left:0}
  /* 顶部固定条 */
  header{position:fixed;top:0;left:0;right:0;height:64px;z-index:100;background:rgba(255,255,255,.88);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;
    padding:0 24px;gap:12px}
  #navToggle{flex:none;width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:#f2f3f5;
    cursor:pointer;font-size:16px;color:var(--ink);display:flex;align-items:center;justify-content:center;transition:.15s}
  #navToggle:hover{background:#e5e6eb}
  header h1{font-size:16px;font-weight:700;white-space:nowrap}
  header .meta{font-size:12px;color:var(--sub);white-space:nowrap}
  header .spacer{flex:1}
  .status{font-size:12px;color:var(--sub);white-space:nowrap}
  .status b{color:var(--ok)}
  .btn{border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;
    transition:.15s;white-space:nowrap}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-primary:hover{background:var(--brand-d)}
  .btn-ghost{background:#f2f3f5;color:var(--ink)}
  .btn-ghost:hover{background:#e5e6eb}
  /* 进度条 */
  .progwrap{position:fixed;top:64px;left:0;right:0;height:3px;background:transparent;z-index:99}
  .progbar{height:100%;width:0;background:linear-gradient(90deg,var(--brand),#22d3ee);transition:width .3s}
  /* 布局 */
  .wrap{max-width:1080px;margin:0 auto;padding:28px 24px 120px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 28px;
    margin-bottom:22px;box-shadow:0 1px 3px rgba(0,0,0,.03);scroll-margin-top:80px}
  .card > h2{font-size:20px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:10px;
    cursor:pointer;user-select:none}
  .card > h2::after{content:'▾';margin-left:auto;font-size:14px;color:var(--sub);font-weight:400;
    transition:transform .2s;flex:none}
  .card.collapsed > h2::after{transform:rotate(-90deg)}
  .card.collapsed{padding-bottom:24px}
  .card.collapsed > h2{margin-bottom:0}
  .card.collapsed > *:not(h2){display:none!important}
  /* 思维导图 */
  .mm-title{font-size:13px;font-weight:700;color:var(--brand-d);margin:20px 0 2px}
  .mm{overflow-x:auto;padding:12px 2px 6px;--mml:#c9cdd4}
  .mm-row,.mm-item{display:flex;align-items:center}
  .mm-col{display:flex;flex-direction:column;gap:10px;padding-left:30px;position:relative}
  .mm-col::before{content:'';position:absolute;left:0;top:17px;bottom:17px;border-left:2px solid var(--mml)}
  .mm-col>.mm-row{position:relative}
  .mm-col>.mm-row::before{content:'';position:absolute;left:-30px;top:50%;width:30px;border-top:2px solid var(--mml)}
  .mm .node{display:inline-block;padding:6px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;
    font-size:12.5px;line-height:1.45;box-shadow:0 1px 2px rgba(0,0,0,.03);max-width:260px;white-space:normal}
  .mm .mm-root{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700;max-width:150px}
  .mm .mm-l1{background:#eef3ff;border-color:#cdddff;color:var(--brand-d);font-weight:700}
  .mm .node.hot{background:#fff7f7;border-color:#f3c0c0;color:#c0392b}
  .mm .node.warn{background:#fffbeb;border-color:#f3dca0;color:#8a6a1c}
  .mm .mm-note{display:block;font-size:11px;color:var(--sub);font-weight:400;margin-top:2px}
  .mm .mm-root .mm-note{color:#dbe4ff}
  .card > h2 .tag{font-size:12px;font-weight:600;color:#fff;background:var(--brand);border-radius:6px;
    padding:2px 8px}
  .card .cat-desc{color:var(--sub);font-size:13px;margin:6px 0 18px;padding:10px 14px;background:#f7f8fa;
    border-radius:8px;border-left:3px solid var(--brand)}
  /* 参考型卡片渲染内容 */
  .ref h3{font-size:16px;margin:18px 0 8px}
  .ref h4{font-size:14px;margin:14px 0 6px;color:var(--brand-d)}
  .ref p{margin:8px 0}
  .ref ul,.ref ol{margin:8px 0 8px 22px}
  .ref li{margin:4px 0}
  .ref code{background:#f2f3f5;padding:2px 6px;border-radius:4px;font-size:13px;
    font-family:"SF Mono",Consolas,monospace}
  .ref blockquote{border-left:3px solid var(--star);background:#fffdf5;padding:8px 14px;margin:10px 0;
    border-radius:0 8px 8px 0;color:#7a5b00}
  .ref strong{color:var(--brand-d)}
  .ref hr{border:none;border-top:1px dashed var(--line);margin:16px 0}
  /* 题目条目 */
  .q{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;transition:.15s;
    scroll-margin-top:90px}
  /* ===== 真题索引（三级可收缩） ===== */
  .ridx{margin:2px 0 20px;border:1px solid #cdddff;border-radius:12px;overflow:hidden;background:#fcfdff}
  .ridx-hd{display:flex;align-items:center;gap:8px;padding:11px 16px;background:#eef3ff;cursor:pointer;
    user-select:none;font-size:14px;font-weight:800;color:var(--brand-d)}
  .ridx-hd::after{content:'▾';margin-left:auto;font-size:12px;transition:transform .2s}
  .ridx.closed .ridx-hd::after{transform:rotate(-90deg)}
  .ridx.closed .ridx-bd{display:none}
  .ridx-bd{padding:10px 10px 12px}
  .ridx-tools{display:flex;align-items:center;gap:6px;padding:0 6px 10px;flex-wrap:wrap}
  .ridx-tools button{font-size:11px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;
    background:#fff;color:var(--sub);cursor:pointer;transition:.12s}
  .ridx-tools button:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
  .ridx-lg{margin-left:auto;font-size:10.5px;color:#a0a4ab;display:flex;align-items:center;gap:3px;flex-wrap:wrap}
  /* L1 公司层 */
  .rco{margin:0 0 7px;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
  .rco-hd{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;user-select:none;
    font-size:13.5px;font-weight:700;background:#f7f8fa;transition:.12s}
  .rco-hd:hover{background:#f0f2f5}
  .rco-hd::after{content:'▾';margin-left:auto;font-size:11px;color:var(--sub);transition:transform .2s;flex:none}
  .rco.closed .rco-hd::after{transform:rotate(-90deg)}
  .rco.closed .rco-bd{display:none}
  .rco-date{flex:none;font-size:10.5px;font-weight:700;color:#fff;background:#8f959e;border-radius:5px;padding:1px 7px}
  .rco-n{flex:none;font-size:11px;color:#9aa0a8;font-weight:600}
  .rco-bd{padding:7px 10px 9px}
  .rco-note{font-size:11px;color:var(--sub);padding:2px 8px 8px;line-height:1.55}
  /* L2 维度层 */
  .rdim{margin:3px 0}
  .rdim-hd{display:flex;align-items:center;gap:7px;padding:5px 8px;cursor:pointer;user-select:none;
    font-size:12.5px;font-weight:700;color:var(--brand-d);border-radius:6px;transition:.12s}
  .rdim-hd:hover{background:#f0f5ff}
  .rdim-hd::after{content:'▾';margin-left:auto;font-size:10px;color:#b4b8bf;transition:transform .2s;flex:none}
  .rdim.closed .rdim-hd::after{transform:rotate(-90deg)}
  .rdim.closed .rdim-bd{display:none}
  .rdim-n{flex:none;font-size:10.5px;font-weight:700;color:var(--sub);background:#f2f3f5;border-radius:4px;padding:1px 6px}
  .rdim-c{flex:none;font-size:10.5px;color:#b4b8bf;font-weight:600}
  .rdim-bd{padding-left:14px;margin-left:10px;border-left:2px solid #e9ebf0}
  /* L3 真题层 */
  a.rq{display:flex;align-items:flex-start;gap:7px;padding:5px 8px;font-size:12.5px;color:var(--ink);
    text-decoration:none;border-radius:6px;line-height:1.55;transition:.12s}
  a.rq:hover{background:#f0f5ff;color:var(--brand-d)}
  a.rq .rq-id{flex:none;font-size:10.5px;font-weight:700;color:#9aa0a8;min-width:30px;padding-top:1px}
  .rflag{display:inline-block;flex:none;font-size:10px;font-weight:700;border-radius:4px;padding:0 5px;
    margin-left:5px;line-height:16px;vertical-align:1px}
  .rflag.f-star{background:#e8f7ee;color:#0b8a3e}
  .rflag.f-ok{background:#eef3ff;color:var(--brand-d)}
  .rflag.f-fix{background:#fff3e0;color:#e8590c}
  .rflag.f-miss{background:#fff7e6;color:#b35c00}
  .rflag.f-fail{background:#fef2f2;color:#ef4444}
  /* 跳转闪烁高亮 */
  .q.flash{animation:qflash 1.8s ease-out}
  @keyframes qflash{0%,22%{background:#fff8e1;border-color:var(--star);box-shadow:0 0 0 3px rgba(245,158,11,.16)}
    100%{background:transparent;box-shadow:none}}
  .q.answered{border-color:#b7ebc6;background:#fbfffc}
  .q-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
  .q-num{flex:none;width:30px;height:30px;border-radius:8px;background:#f2f3f5;color:var(--sub);
    font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .q.answered .q-num{background:var(--ok);color:#fff}
  .q-body{flex:1}
  .q-text{font-size:15px;font-weight:600;line-height:1.6}
  .q-text b,.q-text strong{color:var(--brand-d)}
  .stars{font-size:12px;color:var(--star);letter-spacing:1px;margin-left:6px}
  .lvl{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;margin-right:6px;
    vertical-align:middle}
  .lvl.l3{background:var(--s3);color:var(--s3b)} .lvl.l2{background:var(--s2);color:var(--s2b)}
  .lvl.l1{background:var(--s1);color:var(--s1b)}
  .lvl.real{background:#111827;color:#fff;letter-spacing:.5px}
  .q.is-real{border-left:3px solid #111827}
  .ref .danger,.danger{color:#dc2626;font-weight:800}
  .rflag.f-fail{background:#fef2f2;color:#dc2626;font-weight:800}
  .rflag.f-miss{background:#fdecec;color:#dc2626;font-weight:800}
  /* 答题区 */
  .ans{margin-top:6px}
  .tabs{display:flex;gap:4px;margin-bottom:8px}
  .tab{font-size:12px;padding:4px 12px;border-radius:6px 6px 0 0;cursor:pointer;color:var(--sub);
    border:1px solid transparent;background:none}
  .tab.on{color:var(--brand);font-weight:700;background:#f0f5ff}
  textarea.inp{width:100%;min-height:110px;border:1px solid var(--line);border-radius:8px;padding:12px 14px;
    font-size:14px;line-height:1.7;resize:vertical;font-family:inherit;background:#fcfcfd;transition:.15s}
  textarea.inp:focus{outline:none;border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(51,112,255,.1)}
  .preview{border:1px solid var(--line);border-radius:8px;padding:12px 16px;min-height:110px;background:#fcfcfd;
    font-size:14px}
  .preview:empty::before{content:"（还没有内容，切到 编辑 写下你的答案，支持 Markdown）";color:#bbb;font-size:13px}
  .preview h1,.preview h2,.preview h3,.preview h4{margin:8px 0 4px}
  .preview ul,.preview ol{margin:6px 0 6px 20px} .preview li{margin:3px 0}
  .preview p{margin:6px 0} .preview strong{color:var(--brand-d)}
  .preview code{background:#f2f3f5;padding:2px 6px;border-radius:4px;font-family:"SF Mono",Consolas,monospace;font-size:13px}
  .preview blockquote{border-left:3px solid var(--star);background:#fffdf5;padding:6px 12px;margin:8px 0;color:#7a5b00}
  .preview pre{background:#1e293b;color:#e2e8f0;padding:12px;border-radius:8px;overflow:auto;margin:8px 0}
  .preview pre code{background:none;color:inherit;padding:0}
  .hint{font-size:11px;color:#a0a4ab;margin-top:4px}
  /* Toast */
  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:#1f2329;
    color:#fff;padding:10px 22px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;
    transition:.25s;z-index:200}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* 左侧目录 */
  #sidebar{position:fixed;top:64px;left:0;bottom:0;width:248px;background:#fff;border-right:1px solid var(--line);
    overflow-y:auto;padding:14px 12px 48px;z-index:90;transition:transform .25s}
  body.nav-collapsed #sidebar{transform:translateX(-100%)}
  #sidebar .side-tools{display:flex;gap:6px;margin:4px 6px 12px}
  #sidebar .side-tools button{flex:1;font-size:11px;padding:6px 4px;border:1px solid var(--line);border-radius:7px;
    background:#f7f8fa;color:var(--sub);cursor:pointer;transition:.12s}
  #sidebar .side-tools button:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
  #sidebar .side-h{font-size:11px;color:#a0a4ab;padding:10px 10px 4px;font-weight:700;letter-spacing:.4px}
  #sidebar a{display:block;font-size:13px;padding:7px 10px;border-radius:8px;color:var(--sub);text-decoration:none;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.12s}
  #sidebar a:hover{background:#f2f3f5;color:var(--ink)}
  #sidebar a.cur{background:#f0f5ff;color:var(--brand);font-weight:600}
  #sidebar a.hl-green{background:#e8f7ee;color:#0b8a3e;font-weight:700}
  #sidebar a.hl-orange{background:#fff3e0;color:#e8590c;font-weight:700}
  #sidebar a.hl-red{background:#fef2f2;color:#dc2626;font-weight:700}
  #sidebar a .ab{display:inline-block;min-width:30px;color:#b4b8bf;font-size:11px;font-weight:700}
  @media(max-width:860px){
    body{padding-left:0}
    #sidebar{transform:translateX(-100%);box-shadow:0 8px 30px rgba(0,0,0,.18)}
    body.nav-open #sidebar{transform:translateX(0)}
  }
  @media(max-width:640px){header h1{font-size:14px}.wrap{padding:16px 12px 100px}.card{padding:18px 16px}
    header .meta{display:none}}
  /* ============================================================
     Neubrutalism 皮肤（克制版）· 覆盖层
     粗黑边 + 硬阴影 + 野兽派亮色 + 直角；正文/答题区保持干净易读
     ============================================================ */
  h1,h2,h3,h4,.btn,.tag,.lvl,.rflag{font-weight:700}
  /* 顶栏 */
  header{background:#fff;border-bottom:3px solid #111;backdrop-filter:none}
  header h1{font-weight:800}
  #navToggle{border:2px solid #111;border-radius:0;box-shadow:var(--shadow-sm);background:#fff}
  #navToggle:hover{background:var(--star)}
  /* 按钮：直角 + 粗黑边 + 硬阴影 + 悬停位移吃掉阴影 */
  .btn{border:2px solid #111;border-radius:0;box-shadow:var(--shadow-sm);transition:transform .12s,box-shadow .12s}
  .btn:hover{transform:translate(2px,2px);box-shadow:none}
  .btn-primary{background:#111;color:#fff}
  .btn-primary:hover{background:#111}
  .btn-ghost{background:#fff;color:#111}
  .btn-ghost:hover{background:var(--star)}
  /* 进度条：实色无渐变 */
  .progbar{background:var(--brand)}
  /* 卡片：直角 + 粗黑边 + 硬阴影 */
  .card{border:3px solid #111;border-radius:0;box-shadow:var(--shadow)}
  .card>h2{font-weight:800}
  .card>h2 .tag{background:#111;color:#fff;border-radius:0}
  .cat-desc{border-radius:0;border-left:6px solid #111;background:#FFF3BF;color:#111}
  /* 题目条目：直角 + 黑边 */
  .q{border:2px solid #111;border-radius:0;transition:transform .12s,box-shadow .12s}
  .q:hover{box-shadow:var(--shadow-sm)}
  .q.answered{background:#EAFBF1;border-color:#111}
  .q.answered .q-num{background:var(--ok);color:#fff}
  .q-num{border:2px solid #111;border-radius:0;background:#fff;color:#111}
  /* 难度 / 真题 徽章：直角 + 黑边 */
  .lvl{border:2px solid #111;border-radius:0}
  .lvl.l3{background:var(--s3);color:#111}
  .lvl.l2{background:var(--s2);color:#111}
  .lvl.l1{background:var(--s1);color:#111}
  .lvl.real{background:#111;color:#fff}
  .q.is-real{border-left:8px solid #111}
  /* 答题区：黑边直角，保持干净（聚焦才强调） */
  textarea.inp,.preview{border:2px solid #111;border-radius:0;background:#fff}
  textarea.inp:focus{box-shadow:var(--shadow-sm);border-color:#111}
  .tab{border-radius:0}
  .tab.on{background:var(--star);color:#111;border:2px solid #111;border-bottom:none}
  /* 参考卡内文 */
  .ref blockquote{border-left:6px solid #111;background:#FFF3BF;border-radius:0;color:#111}
  .ref code{background:#FFEFA6;border:1px solid #111;border-radius:0;color:#111}
  .ref strong{color:#111}
  .ref hr{border-top:2px dashed #111}
  /* 危险信号：红字加粗（翻/漏），覆盖后仍最醒目 */
  .ref .danger,.danger{color:#D62828;font-weight:800}
  /* 真题索引（三级折叠） */
  .ridx{border:3px solid #111;border-radius:0;background:#fff}
  .ridx-hd{background:var(--star);color:#111;border-bottom:3px solid #111}
  .ridx-tools button{border:2px solid #111;border-radius:0}
  .ridx-tools button:hover{background:#111;color:#fff}
  .rco{border:2px solid #111;border-radius:0}
  .rco-hd{background:#F2F0E6}
  .rco-date{background:#111;border-radius:0}
  .rdim-n{background:#111;color:#fff;border-radius:0}
  .rdim-bd{border-left:3px solid #111}
  a.rq .rq-id{color:#111}
  /* 复盘表现 flag：野兽派亮色 + 黑边；漏/翻=红 */
  .rflag{border:2px solid #111;border-radius:0}
  .rflag.f-star{background:#9BF6C9;color:#06402B}
  .rflag.f-ok{background:#A0C4FF;color:#0B2E8A}
  .rflag.f-fix{background:#FFB347;color:#5A3300}
  .rflag.f-miss{background:#FF5A5A;color:#111}
  .rflag.f-fail{background:#FF2D2D;color:#fff}
  /* 思维导图：直角 + 黑边 + 硬阴影 */
  .mm{--mml:#111}
  .mm .node{border:2px solid #111;border-radius:0;box-shadow:var(--shadow-sm)}
  .mm .mm-root{background:#111;color:#fff;border-color:#111}
  .mm .mm-l1{background:#A0C4FF;color:#111;border-color:#111}
  .mm .node.hot{background:#FF5A5A;color:#111;border-color:#111}
  .mm .node.warn{background:var(--s2);color:#111;border-color:#111}
  .mm .mm-note{color:#333}
  .mm .mm-root .mm-note{color:#eee}
  /* 侧栏 */
  #sidebar{border-right:3px solid #111}
  #sidebar .side-tools button{border:2px solid #111;border-radius:0;background:#fff}
  #sidebar .side-tools button:hover{background:#111;color:#fff}
  #sidebar a{border-radius:0}
  #sidebar a.cur{background:var(--brand);color:#fff;font-weight:700}
  #sidebar a.hl-green{background:#9BF6C9;color:#06402B;border:2px solid #111;margin:3px 2px}
  #sidebar a.hl-orange{background:#FFB347;color:#5A3300;border:2px solid #111;margin:3px 2px}
  #sidebar a.hl-red{background:#FF5A5A;color:#111;border:2px solid #111;margin:3px 2px}
  /* Toast + 进度槽 */
  .toast{border:2px solid #fff;border-radius:0}
  /* ========== 淡紫色小节总结块 + 荧光笔重点 ========== */
  /* 章/节开头总结块：套用复盘开头总结块的样式，配色改淡紫色 */

  .ref strong,.q-text strong,.q-text b,.preview strong{

    padding:0 1px;-webkit-box-decoration-break:clone;box-decoration-break:clone}

  .ref .danger,.danger{

    background:linear-gradient(transparent 38%,#FF8FBE 38%);
    padding:0 1px;-webkit-box-decoration-break:clone;box-decoration-break:clone}

  /* 标题层级字号 */

  .ref h3{font-size:16px;font-weight:700;margin:16px 0 6px}
  .ref h4{font-size:14px;font-weight:700;margin:12px 0 6px;color:#111}

  .ref .fold-h{cursor:pointer;user-select:none;display:flex;align-items:center;gap:8px}
  .ref .fold-h::after{content:'▾';font-size:12px;color:#777;font-weight:400;transition:transform .15s;margin-left:auto}
  .ref .fold-h.collapsed::after{transform:rotate(-90deg)}
  /* 复盘条目：问题/答案/点评 分点缩进，不挤成一块 */
  .ref .rv-item{list-style:none;margin:12px 0;padding-left:0}
  .ref .rv-q{font-weight:700;color:#111;margin-bottom:5px;line-height:1.6}
  .ref ul.rv-sub{list-style:none;margin:3px 0 3px 4px;padding-left:14px;border-left:2px dashed #c7c2b4}
  .ref ul.rv-sub>li{margin:4px 0;position:relative;padding-left:18px;line-height:1.65}
  .ref ul.rv-sub>li::before{position:absolute;left:0;top:0;font-size:11px;font-weight:700}
  .ref li.rv-a::before{content:'答';color:#0B6E68}
  .ref li.rv-c::before{content:'评';color:#8A6A00}
  /* 危险块：整条玫红底（题号按钮除外） */
  .ref .danger-block{background:#FFE1EC;border-left:4px solid #FF2D7A;padding:5px 10px;border-radius:0}
  .ref li.rv-c.danger-block::before{content:'险';color:#B3005B}
  .ref .danger-block .danger{background:none;padding:0;color:#B3005B;font-weight:800}

    box-shadow:2px 2px 0 #111;vertical-align:1px;transition:transform .1s,box-shadow .1s}
  a.qjump:hover{transform:translate(1px,1px);box-shadow:1px 1px 0 #111;color:#fff}
  /* 真题备注行：比题干小一号的灰字 */
  .q-note{font-size:13px;color:#8a8a8a;margin-top:5px;line-height:1.65}
  .q-note strong{background:none;color:#5f5f5f;font-weight:700}
  /* 目录·实战复盘：采用参考 html 的配色（珊瑚/黄/薄荷） */

  /* ========== 复盘格式整理：图例统一 / 问题黄标 / 危险块收敛 / 行距段距 ========== */

  .ref{line-height:1.9}

  .ref .rv-item{margin:20px 0}
  .ref .rv-q{margin-bottom:10px}

  .ref .rv-q strong{background:linear-gradient(transparent 38%,#FFE066 38%);color:#111;font-weight:700}

  /* ========== 导出下拉菜单 ========== */

    .chap-break{break-before:page}

    .q,.rv-item,.rco,.mm,.mm-row,.cat-desc,.ref blockquote,.ref ul.rv-sub,
    .ref>ul>li,.ref>ol>li,.ref>p{break-inside:avoid}

    .tabs,.hint,textarea.inp,.ridx-tools,.side-tools{display:none!important}

    a.qjump{box-shadow:none;border-width:1px}

  /* 旗标（亮/稳/改/漏/翻）引导的加粗短语：一律不加荧光，仅纯加粗（徽章颜色已表语义） */
  .ref strong.dgr-strong,.ref strong.pos-strong{background:none;color:#111}

  .ref .dgr{background:linear-gradient(transparent 38%,#FF8FBE 38%);color:#111;font-weight:700}

  .ref .danger-block strong,.ref .danger-block .dgr{background:none;color:#B3005B;font-weight:800}

  .hl-palette button.on{outline:3px solid #111;outline-offset:1px}
  body.hl-mode,body.hl-mode textarea.inp{cursor:crosshair}
</style>

const CATS = BANK.dims.map(d=>({id:d.id,title:d.title,tag:d.tag,desc:d.desc,
  qs:BANK.questions.filter(q=>q.dim===d.id).map(q=>q.real?[q.id,q.star,q.text,1]:[q.id,q.star,q.text])}));

const REF_THINK = `拿到任何问题，前 5 秒只做一件事：**定性**。定性错了，结构一定错。

### 第一步：定性（决定答题结构）
- **事实题**（你做了什么、数字多少）→ 验真 → 走「短结论 + 证据」
- **设计题 / Case 题**（怎么做、怎么解）→ 看思维过程 → **必须先分析后方案**
- **判断题**（你怎么看、有没有前途）→ 看行业认知与立场 → 走「先给立场 + 三条依据」
- **动机题**（为什么、想做什么）→ 看匹配度与稳定性 → 走「事实 + 判断 + 我能补的」

### 第二步：四维扫描（口诀：链 · 人 · 证 · 界）
- **链｜链路在哪**：拆成有先后的环节（输入→处理→输出→反馈），指出瓶颈在哪个节点、属于算法/工程/产品问题。**设计/Case 题永远第一个想这一维。**
- **人｜谁的问题**：谁是用户、谁拍板、面试官为什么此刻问这个（验真？找共识？挖短板？）。意图决定你讲哪一半。
- **证｜证据是什么**：一个带分母的数字 + 一个能放出画面的例子（把抽象结论换成具体场景）。
- **界｜边界在哪**：成本上限、能力上限、不做什么、失败怎么兜底、结论在什么条件下不成立。主动给边界＝诚实且资深。

四维不必都讲，但都要**扫过**。扫完再开口——停 2 秒是加分的，抢答是减分的。`;
const REF_ANSWER = `### 主模板（设计题 / Case 题 / 优化题通用，5 段式）
1. **对齐**（1 句）：确认边界或口径——"我理解这个问题是……，我按 XX 场景来答，可以吗"
2. **拆解**（2–3 句）："我把它拆成 A / B / C 三个环节"——先给结构，不给答案
3. **定位**（1–2 句）："其中 B 是瓶颈，因为……；A 属于工程问题、C 属于模型问题"
4. **方案与取舍**（2–3 句）：针对瓶颈给动作，**并说为什么不选另一个方案**
5. **证据 + 边界**（1–2 句）：带分母的数字或真实 badcase 收尾，再加前提与例外

> 核心纪律：**第 4 步之前不许出现方案。** 设计/Case 题最常见的失分就是一上来就给方案——先分析后方案，记死。

### 项目介绍模板（3 分钟，只讲两个功能）
1. **一句话结论**：产品是什么、我做了什么（动词降级：我们做了 X，我负责其中 Y）
2. **用户动作型痛点**：不说抽象结论，说一个能放出画面的具体场景（谁、在什么情境下、被什么卡住）
3. **互补框架**："重点讲两个功能——前者解决 A，后者解决 B"
4. **各展开一层机制**：workflow 怎么走、Prompt 改了什么、关键参数为什么这么定
5. **3–4 个最硬数字收口**：每个数字都能说出分母（渗透率、留存、成本降幅、无效输出降幅……）

### 事实/数字题（20 秒答完）
口径 → 数值 → 一句归因 → 停。被追问再展开，不要一次说完。

### 判断/行业题
立场 → 三条依据（技术成熟度 / 成本结构 / 场景刚性）→ 一个反面观点 → 我的落点。
> **不要连续两次说"我了解不多"**——承认一次，后面用可推导的逻辑接着答。

### 动机题
我看到的事实 → 我的判断 → 我已经做了什么 → 我想补什么。不评价旧团队，不说"想学习"。

### 禁用词（说出口就扣可信度）
\`闭环\` \`横向\` \`建设\` \`赋能\` \`精细化\` \`智能感\` \`打造\` \`全面\` \`抑制幻觉\` \`提升体验\`
每个抽象词后面必须能接"具体表现是什么"，接不上就换成机制描述。

### 出口自检（说完前在心里过一遍）
- 先分析后方案了吗？
- 数字带分母了吗？
- "我负责"守得住吗？守不住降级成"我们做了 X，我负责 Y"。
- 有一个能放出画面的具体例子吗？
- 听起来像背的吗？允许自己"嗯……我想一下"。`;
/* ============ 迷你 Markdown 解析器 ============ */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function inline(s){
  return s
    .replace(/`([^`]+)`/g,(m,c)=>'<code>'+c+'</code>')
    .replace(/(\*\*)?Q(\d{1,4})\1/g,'<a class="qjump" data-qid="q$2" href="#q$2">Q$2</a>')
    .replace(/==([bopr])\|([^=]*)==/g,'<span class="hl hl-$1">$2</span>')
    .replace(/!!([^!]+)!!/g,'<span class="dgr">$1</span>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/【(亮|稳|改|漏|翻)([^】]*)】/g,function(m,f,rest){
      var cls={'亮':'f-star','稳':'f-ok','改':'f-fix','漏':'f-miss','翻':'f-fail'}[f];
      return '<span class="rflag '+cls+'">'+f+'</span>'+rest.replace(/^[·：:]\s*/,'');
    })
    .replace(/<strong>(<span class="rflag f-(?:fix|miss|fail)")/g,'<strong class="dgr-strong">$1')
    .replace(/<strong>(<span class="rflag f-(?:star|ok)")/g,'<strong class="pos-strong">$1')
    .replace(/｜/g,'<span class="vsep">｜</span>');
}
function liWrap(c){return '<li'+(/rflag f-(fail|miss)/.test(c)?' class="danger-block"':'')+'>'+c+'</li>';}
/* 复盘条目拆分：问题（领头加粗）→ 答案 → 点评（含 flag/题号），分点缩进 */
function reviewItem(c){
  if(c.indexOf('→')<0) return liWrap(c);
  const ai=c.indexOf('→');
  const q=c.slice(0,ai).trim();
  let rest=c.slice(ai+1).trim();
  let answer=rest,concl='';
  const fi=rest.search(/<strong><span class="rflag|<strong>【/);
  if(fi>=0){answer=rest.slice(0,fi).trim();concl=rest.slice(fi).trim();}
  let sub='<ul class="rv-sub">';
  if(answer.replace(/<[^>]*>/g,'').replace(/[。、\s]/g,'')) sub+='<li class="rv-a">'+answer+'</li>';
  if(concl){const cd=/rflag f-(fail|miss)/.test(concl);sub+='<li class="rv-c'+(cd?' danger-block':'')+'">'+concl+'</li>';}
  sub+='</ul>';
  return '<li class="rv-item"><div class="rv-q">'+q+'</div>'+sub+'</li>';
}
function mdToHtml(md,opts){
  opts=opts||{};
  if(!md||!md.trim())return '';
  const lines=esc(md).split('\n');let html='',i=0;
  while(i<lines.length){
    let l=lines[i];
    if(/^```/.test(l)){let code='';i++;while(i<lines.length&&!/^```/.test(lines[i])){code+=lines[i]+'\n';i++;}i++;html+='<pre><code>'+code+'</code></pre>';continue;}
    let h=l.match(/^(#{1,4})\s+(.*)/);
    if(h){const n=h[1].length;html+='<h'+n+'>'+inline(h[2])+'</h'+n+'>';i++;continue;}
    if(/^&gt;\s?/.test(l)){let bq='';while(i<lines.length&&/^&gt;\s?/.test(lines[i])){bq+=lines[i].replace(/^&gt;\s?/,'')+' ';i++;}html+='<blockquote>'+inline(bq.trim())+'</blockquote>';continue;}
    if(/^\s*[-*+]\s+/.test(l)){let items='';while(i<lines.length&&/^\s*[-*+]\s+/.test(lines[i])){const c=inline(lines[i].replace(/^\s*[-*+]\s+/,''));items+=opts.review?reviewItem(c):liWrap(c);i++;}html+='<ul>'+items+'</ul>';continue;}
    if(/^\s*\d+\.\s+/.test(l)){let items='';while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i])){items+=liWrap(inline(lines[i].replace(/^\s*\d+\.\s+/,'')));i++;}html+='<ol>'+items+'</ol>';continue;}
    if(/^\s*---\s*$/.test(l)){html+='<hr>';i++;continue;}
    if(l.trim()===''){i++;continue;}
    let para=l;while(i+1<lines.length&&lines[i+1].trim()!==''&&!/^(#{1,4}\s|&gt;|\s*[-*+]\s|\s*\d+\.\s|```|\s*---)/.test(lines[i+1])){para+='<br>'+lines[i+1];i++;}
    const ph=inline(para);
    html+='<p'+(/rflag f-(fail|miss)/.test(ph)?' class="danger-block"':'')+'>'+ph+'</p>';i++;
  }
  return html;
}

/* 每一级标题可单独折叠：点标题，收起/展开其后到下一个同级或更高级标题之间的内容 */
function foldHeadings(ref){
  if(!ref)return;
  [...ref.children].forEach(node=>{
    const m=node.tagName&&node.tagName.match(/^H([1-4])$/);if(!m)return;
    const lv=+m[1];node.classList.add('fold-h');
    node.addEventListener('click',()=>{
      const col=node.classList.toggle('collapsed');
      let sib=node.nextElementSibling;
      while(sib){
        const sm=sib.tagName&&sib.tagName.match(/^H([1-4])$/);
        if(sm&&+sm[1]<=lv)break;
        sib.style.display=col?'none':'';
        sib=sib.nextElementSibling;
      }
    });
  });
}

/* ============ 思维导图 ============ */
function mmNode(node,depth){
  const cls=depth===0?'mm-root':(depth===1?'mm-l1':'mm-l2');
  const extra=node.lv?(' '+node.lv):'';
  const note=node.note?('<span class="mm-note">'+inline(esc(node.note))+'</span>'):'';
  let h='<div class="mm-item"><div class="node '+cls+extra+'">'+inline(esc(node.t))+note+'</div>';
  if(node.c&&node.c.length){
    h+='<div class="mm-col">'+node.c.map(ch=>'<div class="mm-row">'+mmNode(ch,depth+1)+'</div>').join('')+'</div>';
  }
  return h+'</div>';
}
function mindmap(root){
  const d=document.createElement('div');d.className='mm';
  d.innerHTML='<div class="mm-row">'+mmNode(root,0)+'</div>';return d;
}
function addMap(card,title,root){
  const t=document.createElement('div');t.className='mm-title';t.textContent=title;
  card.appendChild(t);card.appendChild(mindmap(root));
}

/* ============ 卡片折叠 ============ */
wrap.addEventListener('click',e=>{
  const h=e.target.closest('.card > h2');
  if(h && wrap.contains(h)) h.parentElement.classList.toggle('collapsed');
});
function setAllCards(collapse){document.querySelectorAll('#wrap .card').forEach(c=>c.classList.toggle('collapsed',collapse));}
/* ============ 左侧目录 ============ */
const sidebar=document.getElementById('sidebar');
function buildSidebar(){
  let h='<div class="side-tools"><button id="collapseAll">全部折叠</button><button id="expandAll">全部展开</button></div>';
  h+='<div class="side-h">实战复盘</div>';
  BANK.reviews.forEach(r=>{h+='<a class="hl-'+r.hl+'" href="#'+r.id+'">\u2605 '+r.nav+'</a>';});
  h+='<div class="side-h">框架</div>';
  h+='<a href="#classify">一、维度分类</a>';
  h+='<div class="side-h">题库 · '+QIDS.length+' 题</div>';
  h+='<a href="#bank">二、模拟面试问题集</a>';
  CATS.forEach(c=>{h+='<a href="#'+c.id+'"><span class="ab">'+c.id+'</span>'+c.title+'（'+c.qs.length+'）</a>';});
  h+='<div class="side-h">方法</div>';
  h+='<a href="#think">三、思考框架</a><a href="#answer">四、回答模板</a>';
  sidebar.innerHTML=h;
  document.getElementById('collapseAll').addEventListener('click',()=>setAllCards(true));
  document.getElementById('expandAll').addEventListener('click',()=>setAllCards(false));
  // 窄屏点击条目后自动收起浮层
  sidebar.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{
    if(window.matchMedia('(max-width:860px)').matches) document.body.classList.remove('nav-open');
  }));
}
buildSidebar();
/* 目录开关：宽屏切 nav-collapsed（挤压内容），窄屏切 nav-open（浮层） */
document.getElementById('navToggle').addEventListener('click',()=>{
  if(window.matchMedia('(max-width:860px)').matches) document.body.classList.toggle('nav-open');
  else document.body.classList.toggle('nav-collapsed');
});
/* 滚动高亮当前区块 */
const navLinks=[...sidebar.querySelectorAll('a[href^="#"]')];
const spy=new IntersectionObserver(es=>{
  es.forEach(en=>{if(en.isIntersecting){
    const id=en.target.id;navLinks.forEach(a=>a.classList.toggle('cur',a.getAttribute('href')==='#'+id));
  }});
},{rootMargin:'-70px 0px -70% 0px'});
BANK.reviews.map(r=>r.id).concat(['classify','bank','think','answer']).concat(CATS.map(c=>c.id)).forEach(id=>{const el=document.getElementById(id);if(el)spy.observe(el);});
/* ============ 进度 ============ */
function updateProgress(){
  const total=QIDS.length;let done=0;
  QIDS.forEach(n=>{if((store['q'+n]||'').trim())done++;});
  document.getElementById('progbar').style.width=(done/total*100)+'%';
}
/* ============ Toast ============ */
let toastTimer;
function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}
/* ============ 导出 ============ */
function exportData(){
  let md='# 面试答案备份\n\n> 导出时间：'+new Date().toLocaleString()+'\n\n';
  const map={};CATS.forEach(c=>c.qs.forEach(q=>map[q[0]]={cat:c.id+' '+c.title,text:q[2]}));
  let cur='';
  QIDS.forEach(n=>{
    const v=(store['q'+n]||'').trim();if(!v)return;
    if(map[n].cat!==cur){cur=map[n].cat;md+='\n## '+cur+'\n\n';}
    md+='**Q'+n+'. '+map[n].text+'**\n\n'+v+'\n\n---\n\n';
  });
  const blob=new Blob([md],{type:'text/markdown;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='面试答案备份_'+new Date().toISOString().slice(0,10)+'.md';
  a.click();URL.revokeObjectURL(a.href);toast('已导出 Markdown 备份');
}
/* ============ 导出 PDF（浏览器打印 / 另存为 PDF） ============ */
function expandForPrint(){
  document.querySelectorAll('#wrap .card.collapsed').forEach(c=>c.classList.remove('collapsed'));
  document.querySelectorAll('.ridx.closed,.rco.closed,.rdim.closed').forEach(x=>x.classList.remove('closed'));
  document.querySelectorAll('.ref .fold-h.collapsed').forEach(h=>{
    h.classList.remove('collapsed');const hm=h.tagName.match(/^H([1-4])$/);let sib=h.nextElementSibling;
    while(sib){const sm=sib.tagName&&sib.tagName.match(/^H([1-4])$/);if(sm&&+sm[1]<=+hm[1])break;sib.style.display='';sib=sib.nextElementSibling;}
  });
  document.querySelectorAll('#wrap .q').forEach(q=>{
    const ta=q.querySelector('textarea.inp'),pv=q.querySelector('.preview'),ans=q.querySelector('.ans');
    if(!ta||!pv||!ans)return;
    if(ta.value.trim()){pv.innerHTML=mdToHtml(ta.value);pv.style.display='';ta.style.display='none';}
    else{ans.style.display='none';}
  });
  document.querySelectorAll('#wrap > .card').forEach(card=>{
    if(card.querySelector('.ref.review')||['classify','bank','think','answer'].includes(card.id))card.classList.add('chap-break');
  });
}
function restoreAfterPrint(){
  document.body.classList.remove('printing');
  document.querySelectorAll('#wrap > .card.chap-break').forEach(c=>c.classList.remove('chap-break'));
  document.querySelectorAll('#wrap .q').forEach(q=>{
    const ta=q.querySelector('textarea.inp'),pv=q.querySelector('.preview'),ans=q.querySelector('.ans');
    if(ans)ans.style.display='';if(pv)pv.style.display='none';if(ta)ta.style.display='';
    const tb=q.querySelectorAll('.tab');if(tb[0])tb[0].classList.add('on');if(tb[1])tb[1].classList.remove('on');
  });
}
function printPDF(){document.body.classList.add('printing');expandForPrint();setTimeout(()=>window.print(),80);}
window.addEventListener('afterprint',restoreAfterPrint);
/* ============ 绑定 + 初始化 ============ */
document.getElementById('saveBtn').addEventListener('click',()=>saveNow(false));
const expMenu=document.getElementById('expMenu');
document.getElementById('exportBtn').addEventListener('click',e=>{e.stopPropagation();expMenu.classList.toggle('show');});
document.getElementById('expMd').addEventListener('click',()=>{expMenu.classList.remove('show');exportData();});
document.getElementById('expPdf').addEventListener('click',()=>{expMenu.classList.remove('show');printPDF();});
document.addEventListener('click',()=>expMenu.classList.remove('show'));
/* ============ 格式工具栏：加粗 / 四色荧光笔（作用于当前答案输入框的选区） ============ */
let lastTA=null,hlMode=false,hlColor='b';
document.getElementById('wrap').addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('inp'))lastTA=e.target;});
function wrapSel(pre,post){
  let ta=lastTA;
  if(!ta||!ta.classList.contains('inp')){const a=document.activeElement;ta=(a&&a.classList&&a.classList.contains('inp'))?a:null;}
  if(!ta){toast('先点进某道题的答案框并选中文本');return;}
  const s=ta.selectionStart,e=ta.selectionEnd;
  if(s==null||s===e){toast('先选中要格式化的文本');return;}
  const v=ta.value;ta.value=v.slice(0,s)+pre+v.slice(s,e)+post+v.slice(e);
  ta.dispatchEvent(new Event('input',{bubbles:true}));
  ta.focus();ta.setSelectionRange(s,e+pre.length+post.length);
}
const fmtBold=document.getElementById('fmtBold');
fmtBold.addEventListener('click',e=>{e.stopPropagation();wrapSel('**','**');fmtBold.classList.add('on');setTimeout(()=>fmtBold.classList.remove('on'),250);});
const fmtHl=document.getElementById('fmtHl'),hlPalette=document.getElementById('hlPalette');
function setHlMode(on){hlMode=on;document.body.classList.toggle('hl-mode',on);fmtHl.classList.toggle('on',on);hlPalette.classList.toggle('show',on);}
fmtHl.addEventListener('click',e=>{e.stopPropagation();setHlMode(!hlMode);});
hlPalette.querySelectorAll('button').forEach(b=>b.addEventListener('click',e=>{
  e.stopPropagation();hlColor=b.dataset.c;hlPalette.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
}));
hlPalette.querySelector('[data-c="b"]').classList.add('on');
document.addEventListener('mouseup',()=>{
  if(!hlMode)return;const ta=document.activeElement;
  if(ta&&ta.classList&&ta.classList.contains('inp')&&ta.selectionStart!==ta.selectionEnd){lastTA=ta;wrapSel('=='+hlColor+'|','==');}
});
// 5 分钟自动保存
setInterval(()=>saveNow(true),5*60*1000);
// 离开页面前保存
window.addEventListener('beforeunload',()=>{try{localStorage.setItem(LS_KEY,JSON.stringify(store));}catch(e){}});
// 恢复上次保存时间
const savedAt=localStorage.getItem(LS_TS);
updateStatus(savedAt?new Date(savedAt):null);
updateProgress();
</script>
